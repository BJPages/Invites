<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app hidden">
    <section id="heroSection" class="hero">
      <div class="overlay"></div>

      <div class="hero-content container">
        <p id="eventTag" class="event-tag hidden"></p>
        <h1 id="title" class="title hidden"></h1>
        <p id="subtitle" class="subtitle hidden"></p>

        <div id="heroActions" class="hero-actions hidden">
          <button id="musicBtn" class="btn btn-secondary hidden" type="button">
            Reproducir música
          </button>
        </div>
      </div>
    </section>

    <section id="countdownSection" class="countdown-section hidden">
      <div class="container">
        <h2 class="section-title">Faltan</h2>

        <div id="countdown" class="countdown">
          <div class="count-box">
            <span id="days">0</span>
            <small>Días</small>
          </div>
          <div class="count-box">
            <span id="hours">0</span>
            <small>Horas</small>
          </div>
          <div class="count-box">
            <span id="minutes">0</span>
            <small>Minutos</small>
          </div>
          <div class="count-box">
            <span id="seconds">0</span>
            <small>Segundos</small>
          </div>
        </div>
      </div>
    </section>

    <section id="detailsSection" class="details-section hidden">
      <div class="container narrow">
        <h2 class="section-title">Detalles</h2>
        <p id="eventDateText" class="detail-line hidden"></p>
        <p id="eventPlace" class="detail-line hidden"></p>
        <p id="eventDescription" class="detail-description hidden"></p>
      </div>
    </section>

    <section id="scheduleSection" class="schedule-section hidden">
      <div class="container narrow">
        <h2 class="section-title">Programa</h2>
        <div id="scheduleList" class="schedule-list"></div>
      </div>
    </section>

    <section id="gallerySection" class="gallery-section hidden">
      <div class="container">
        <h2 class="section-title">Galería</h2>
        <div id="gallery" class="gallery"></div>
      </div>
    </section>

    <section id="giftRegistrySection" class="gift-section hidden">
      <div class="container narrow">
        <h2 class="section-title">Mesa de regalos</h2>
        <div id="giftRegistryList" class="gift-list"></div>
      </div>
    </section>

    <section id="mapSection" class="map-section hidden">
      <div class="container narrow">
        <h2 class="section-title">Ubicación</h2>

        <div id="mapButtonWrapper" class="map-button-wrapper hidden">
          <a
            id="mapOpenBtn"
            class="btn btn-primary"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            Abrir mapa
          </a>
        </div>

        <div id="mapEmbedWrapper" class="map-embed-wrapper hidden">
          <iframe
            id="mapEmbed"
            class="map-embed"
            src=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </section>

    <section id="rsvpSection" class="rsvp-section hidden">
      <div class="container narrow">
        <h2 class="section-title">Confirmar asistencia</h2>

        <form id="rsvpForm" class="rsvp-form">
          <input id="guestName" type="text" placeholder="Tu nombre" />

          <select id="attendance">
            <option value="Sí asistiré">Sí asistiré</option>
            <option value="No podré asistir">No podré asistir</option>
          </select>

          <button type="submit" class="btn btn-primary">
            Confirmar por WhatsApp
          </button>
        </form>

        <p id="rsvpHelp" class="rsvp-help hidden"></p>
        <p id="rsvpMessage" class="rsvp-message"></p>
      </div>
    </section>
  </main>

  <section id="statusScreen" class="status-screen">
    <div class="status-box">
      <h1 id="statusTitle">Cargando invitación...</h1>
      <p id="statusText">Espera un momento por favor.</p>
    </div>
  </section>

  <section id="mapModal" class="map-modal hidden" aria-hidden="true">
    <div id="mapModalBackdrop" class="map-modal-backdrop"></div>
    <div class="map-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="mapModalTitle">
      <div class="map-modal-header">
        <h3 id="mapModalTitle">Ubicación</h3>
        <button id="mapModalClose" class="map-modal-close" type="button" aria-label="Cerrar mapa">×</button>
      </div>
      <div class="map-modal-body">
        <iframe
          id="mapModalFrame"
          class="map-modal-frame"
          src=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </section>

  <audio id="musicPlayer" loop></audio>

  <script src="script.js"></script>
</body>
</html>
