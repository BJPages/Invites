<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XV Años Valeria Sarahí</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Inter:wght@300;400;500;600;700&family=Kaushan+Script&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <audio id="bgMusic" preload="auto" loop></audio>

  <button id="musicToggle" class="music-toggle hidden" type="button" aria-label="Pausar o reproducir musica">
    <span class="music-icon" data-music-icon>♪</span>
    <span data-music-label>Música</span>
  </button>

  <main id="app">
    <section id="selector" class="selector-screen">
      <div class="selector-glow glow-a"></div>
      <div class="selector-glow glow-b"></div>

      <div class="selector-content">
        <p class="eyebrow">XV Años de <span data-field="fullName"></span></p>
        <h1 data-field="selectorTitle"></h1>
        <p class="subtitle" data-field="selectorSubtitle"></p>

        <div class="choice-grid">
          <button class="choice-card choice-ruquitos" data-theme="ruquitos" type="button">
            <span class="choice-icon">♕</span>
            <span class="choice-title" data-field="ruquitosTitle"></span>
            <span class="choice-desc" data-field="ruquitosDesc"></span>
          </button>

          <div class="vs">VS</div>

          <button class="choice-card choice-chaviza" data-theme="chaviza" type="button">
            <span class="choice-icon">⚔</span>
            <span class="choice-title" data-field="chavizaTitle"></span>
            <span class="choice-desc" data-field="chavizaDesc"></span>
          </button>
        </div>
      </div>
    </section>

    <section id="ruquitos" class="experience ruquitos hidden">
      <nav class="nav nav-light">
        <div class="logo">VS</div>
        <div class="nav-links">
          <a href="#r-inicio">Inicio</a>
          <a href="#r-evento">Evento</a>
          <a href="#r-galeria">Galería</a>
          <a href="#r-rsvp">Confirmar</a>
        </div>
        <button class="switch-btn" data-back type="button">Elegir lado</button>
      </nav>

      <header id="r-inicio" class="hero hero-ruquitos">
        <div class="crystal c1"></div>
        <div class="crystal c2"></div>
        <div class="butterfly b1">🦋</div>
        <div class="butterfly b2">🦋</div>

        <div class="hero-copy">
          <p class="eyebrow">XV Años de</p>
          <h2>
            <span data-field="firstName"></span>
            <em data-field="middleName"></em>
          </h2>
          <p class="date" data-field="fullDate"></p>
          <p class="place" data-field="location"></p>
        </div>

        <figure class="hero-image-card dress-card">
          <img data-img="ruquitosHero" alt="Imagen principal de Valeria Sarahí" />
        </figure>
      </header>

      <section id="r-evento" class="section section-light">
        <p class="eyebrow">El gran día</p>
        <h3 data-field="formalScheduleTitle"></h3>

        <div class="timeline" data-schedule="formal"></div>
      </section>

      <section class="location-card location-light">
        <div class="location-copy">
          <p class="eyebrow" data-field="location"></p>
          <h3 data-field="ruquitosLocationText"></h3>
          <p data-field="locationDetails"></p>
          <a class="link-button light-button" data-link="maps" target="_blank" rel="noopener">Ver ubicación</a>
        </div>
        <figure class="location-image">
          <img data-img="ruquitosLocation" alt="Referencia visual de Zacatlán, Puebla" />
        </figure>
      </section>

      <section id="r-galeria" class="section section-light">
        <p class="eyebrow">Galería</p>
        <h3 data-field="formalGalleryTitle"></h3>
        <div class="gallery">
          <figure><img data-img="gallery1" alt="Foto 1 de Valeria Sarahí" /></figure>
          <figure><img data-img="gallery2" alt="Foto 2 de Valeria Sarahí" /></figure>
          <figure><img data-img="gallery3" alt="Foto 3 de Valeria Sarahí" /></figure>
          <figure><img data-img="gallery4" alt="Foto 4 de Valeria Sarahí" /></figure>
        </div>
      </section>

      <section id="r-rsvp" class="rsvp rsvp-light">
        <p class="eyebrow">Confirma tu asistencia</p>
        <h3 data-field="rsvpFormal"></h3>
        <a class="rsvp-button" data-link="rsvpFormal" target="_blank" rel="noopener">Confirmar aquí</a>
      </section>
    </section>

    <section id="chaviza" class="experience chaviza hidden">
      <nav class="nav nav-dark">
        <div class="logo anime-logo">VS</div>
        <div class="nav-links">
          <a href="#c-inicio">Inicio</a>
          <a href="#c-evento">Capítulos</a>
          <a href="#c-galeria">Galería</a>
          <a href="#c-rsvp">Misión</a>
        </div>
        <button class="switch-btn" data-back type="button">Elegir lado</button>
      </nav>

      <header id="c-inicio" class="hero hero-chaviza">
        <div class="moon"></div>
        <div class="wisteria left"></div>
        <div class="wisteria right"></div>
        <div class="katana"></div>

        <div class="anime-copy">
          <p class="eyebrow">XV Años de</p>
          <h2>
            <span data-field="firstName"></span>
            <em data-field="middleName"></em>
          </h2>
          <p class="jp-date" data-field="japaneseDate"></p>
          <p class="date" data-field="fullDate"></p>
          <p class="place" data-field="location"></p>
        </div>

        <figure class="anime-hero-image">
          <img data-img="chavizaHero" alt="Arte anime inspirado para Valeria Sarahí" />
        </figure>
      </header>

      <section id="c-evento" class="section section-dark">
        <p class="eyebrow">El gran día</p>
        <h3 data-field="animeScheduleTitle"></h3>

        <div class="timeline anime-timeline" data-schedule="anime"></div>
      </section>

      <section class="location-card location-dark">
        <div class="location-copy">
          <p class="eyebrow" data-field="location"></p>
          <h3 data-field="chavizaLocationText"></h3>
          <p data-field="animeLocationDetails"></p>
          <a class="link-button dark-button" data-link="maps" target="_blank" rel="noopener">Explorar ubicación</a>
        </div>
        <figure class="location-image anime-location-image">
          <img data-img="animeLocation" alt="Referencia anime de Zacatlán, Puebla" />
        </figure>
      </section>

      <section id="c-galeria" class="section section-dark">
        <p class="eyebrow">Galería</p>
        <h3 data-field="animeGalleryTitle"></h3>
        <div class="gallery anime-gallery">
          <figure><img data-img="gallery1" alt="Fragmento 1 de la leyenda" /></figure>
          <figure><img data-img="gallery2" alt="Fragmento 2 de la leyenda" /></figure>
          <figure><img data-img="gallery3" alt="Fragmento 3 de la leyenda" /></figure>
          <figure><img data-img="gallery4" alt="Fragmento 4 de la leyenda" /></figure>
        </div>
      </section>

      <section id="c-rsvp" class="rsvp rsvp-dark">
        <p class="eyebrow">¿Aceptas esta misión?</p>
        <h3 data-field="rsvpAnime"></h3>
        <div class="mission-buttons">
          <a class="rsvp-button" data-link="rsvpAnime" target="_blank" rel="noopener">⚔ Aceptar</a>
          <button type="button">No podré asistir</button>
        </div>
      </section>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
